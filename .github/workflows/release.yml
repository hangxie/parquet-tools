name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Installing Dependencies
        run: make deps
      - name: Build release
        run: make release-build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: build
  github-release:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: build
      - name: Push to github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $(cat ./build/VERSION) \
              --title $(cat ./build/VERSION) \
              --notes-file ./build/CHANGELOG \
              ./build/release/*
  docker-image:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: build
      - name: Retrieve release tag to build
        run: |
          echo "REL_TAG=$(cat ./build/VERSION)" >> ${GITHUB_ENV}
      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The release binaries are cross-compiled before this job, so emulation
      # only has to cover the Debian setup in the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push to docker hub and ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          file: package/container/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # SBOM stays off to avoid the per-platform scanning overhead.
          provenance: mode=max
          sbom: false
          tags: |
            hangxie/parquet-tools:${{ env.REL_TAG }}
            hangxie/parquet-tools:latest
            ghcr.io/hangxie/parquet-tools:${{ env.REL_TAG }}
            ghcr.io/hangxie/parquet-tools:latest
