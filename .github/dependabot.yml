# for more details:
#    https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
